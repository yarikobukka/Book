<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Biblio Radar</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.43.3/dist/umd/supabase.min.js"></script>
  <link rel="stylesheet" href="list.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <!-- ログイン・新規登録用画面-->

  <div id="loginScreen">
    <h2>Biblio Radarへようこそ!</h2>

    <form id="loginForm">
      <div class="form-input">
        <table class="form-table">
          <tr><td>
            <input type="email" id="loginEmail" placeholder="メールアドレス" class="input" required>
          </td></tr>
          <tr><td>
            <div class="password-container">
              <input type="password" id="loginPassword" placeholder="パスワード" class="input" required>
              <button type="button" id="loginpasswordview" class="password-toggle-btn">
                <i class="fa-solid fa-eye-slash"></i>
              </button>
            </div>
          </td></tr>
        </table>
        <button type="button" id="loginBtn" class="button">ログイン</button>
        <button type="button" id="signupBtn" class="button">新規登録</button>
      </div>
    </form>

    <p id="loginMessage"></p>
  </div>

  <!-- メニューボタン-->

  <div id="mainContent" style="display:none;">
    <button id="homeMenuBtn" class="home-menu-btn">≡</button>
    <div id="homeMenu" class="home-menu" style="display:none;">
      <button id="logoutBtn" class="menu-item">ログアウト</button>
      <button id="changePasswordBtn" class="menu-item">パスワード変更</button>
      <button id="appearanceBtn" class="menu-item">表示設定</button>
    </div>

    <!-- メイン画面-->

    <h1>Book List</h1>

    <form id="bookForm">
      <input type="hidden" id="editId">
      <div class="form-input">
        <table class="form-table">
          <tr><td><input type="text" id="title" placeholder="タイトル" class="input"></td></tr>
          <tr><td><input type="text" id="yomigana" placeholder="よみがな" class="input"></td></tr>
          <tr><td><input type="text" id="author" placeholder="著者" class="input"></td></tr>
        </table>
        <button id="submitBtn" class="button" type="submit">登録</button>
      </div>
    </form>

    <div class="content">

      <div id="result"></div>

      <h2>登録済みの書籍</h2>

      <!-- 検索ボックス -->
      <div class="search-wrapper">
        <div class="search-box-container">
          <input type="text" id="searchBox" placeholder="検索" class="input"/>
          <button class="search-mode">⋮</button>
          <div class="menu">
            <p>検索方法を選んでください</p>
            <button class="and">完全一致</button>
            <button class="or">部分一致</button>
          </div>
        </div>
      </div>
      <div class="selectOrder-wrapper">
        <span class="chevron-icon"></span>
        <select id="selectOrder">
          <option value="new" selected>新しい順</option>
          <option value="old">古い順</option>
          <option value="reading">タイトル順</option>
        </select>
      </div>

      <ul id="bookList"></ul>
      <p id="noResult" style="display:none;">該当する書籍が見つかりません</p>

    </div>
  </div>

  <!-- パスワード変更セクション -->
  <div id="changePasswordSection" class="change-password-section" style="display:none;">
    <button class="return-btn"><i class="fa-solid fa-angle-left"></i></button>
    <h1>パスワード変更</h1>
    <p>パスワードは８文字以上にしてください。</p>
    <form id="changePasswordForm">
      <table class="form-table">
        <tr><td>
          <div class="password-container">
            <input type="password" id="oldPassword" placeholder="現在のパスワード" class="input" required>
            <button type="button" id="oldpasswordview" class="password-toggle-btn">
              <i class="fa-solid fa-eye-slash"></i>
            </button>
          </div>
        </td></tr>
        <tr><td>
          <div class="password-container">
            <input type="password" id="newPassword" placeholder="新しいパスワード（8文字以上）" class="input" required minlength="8">
            <button type="button" id="newpasswordview" class="password-toggle-btn">
              <i class="fa-solid fa-eye-slash"></i>
            </button>
          </div>
        </td></tr>
      </table>
      <button type="submit" class="button">変更する</button>
    </form>
    <p id="changePasswordMessage"></p>
  </div>

  <!-- 表示設定セクション -->
  <div id="appearanceSection" class="appearance-section" style="display:none;">
    <button class="return-btn"><i class="fa-solid fa-angle-left"></i></button>
    <h1>表示設定</h1>
    <h2>カラー設定</h2>
    <p>ここで表示設定を変更できます。</p>
    <table class="color-settings">
      <tr>
        <td><label for="themeColor">テーマ色</label></td>
        <td><input type="color" id="themeColor" class="color-input"></td>
      </tr>
      <tr>
        <td><label for="cardColor">カード色</label></td>
        <td><input type="color" id="cardColor" class="color-input"></td>
      </tr>
      <tr>
        <td><label for="textColor">文字色</label></td>
        <td><input type="color" id="textColor" class="color-input"></td>
      </tr>
    </table>
    <button type="button" id="saveAppearanceBtn" class="button">保存</button>
    <p id="appearanceMessage" class="appearance-message"></p>
  </div>

  <script>
    const { createClient } = supabase;
    const client = createClient(
      "https://urfhwurcnoexapukhcey.supabase.co",
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVyZmh3dXJjbm9leGFwdWtoY2V5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTkyMDM5MzAsImV4cCI6MjA3NDc3OTkzMH0.bHVwIfrGVm_pbbSh1UByqgkE3Uq22a6IXcYnZmcJo-Y"
    );

    let currentSort = "new";

    let uiState = "login"; // "login" | "auth"
    let currentUser = null;
    const BOOKS_TABLE = "books";
    const SETTINGS_TABLE_CANDIDATES = ["Settings", "settings"];
    const SECTION_IDS = [
      "loginScreen",
      "mainContent",
      "changePasswordSection",
      "appearanceSection"
    ];

    function getBooksTable() {
      return BOOKS_TABLE;
    }

    function getSettingsTableCandidates() {
      return SETTINGS_TABLE_CANDIDATES;
    }

    function isNetworkFetchError(error) {
      return error instanceof TypeError && error.message === "Failed to fetch";
    }

    function getSupabaseHint(error) {
      if (isNetworkFetchError(error)) {
        if (location.protocol === "file:") {
          return "HTMLファイルを直接開いている可能性があります。Live Server などで http://localhost から開いてください。";
        }
        if (navigator.onLine === false) {
          return "オフラインのため Supabase に接続できません。";
        }
        return "Supabase への通信に失敗しました。URL・anon key・ネット接続・ブラウザ拡張のブロックを確認してください。";
      }

      if (error?.code === "42P01" || error?.code === "PGRST205") {
        return "テーブル名が一致していない可能性があります。Supabase 側で Settings または settings を確認してください。";
      }

      return error?.message || "不明なエラーが発生しました。";
    }

    function isMissingRelationError(error) {
      return error?.code === "42P01" || error?.code === "PGRST205";
    }

    function rgbToHex(rgb) {
      if (!rgb) return "#000000";
      if (rgb.startsWith("#")) return rgb;
      const result = rgb.match(/\d+/g);
      if (!result) return "#000000";
      return (
        "#" +
        result
          .slice(0, 3)
          .map(x => ("0" + parseInt(x, 10).toString(16)).slice(-2))
          .join("")
      );
    }

    function isValidHex(hex) {
      return /^#([0-9A-Fa-f]{6})$/.test(hex);
    }

    function updateTextColorElements(color) {
      document.querySelectorAll("p, label, .input, .menu-item, select").forEach(el => {
        el.style.color = color;
      });
    }

    function applyAppearanceSettings({ themeColor, cardColor, textColor }) {
      if (themeColor) {
        document.body.style.setProperty("--theme-color", themeColor);
        localStorage.setItem("themeColor", themeColor);
      }

      if (cardColor) {
        document.body.style.setProperty("--card-color", cardColor);
        localStorage.setItem("cardColor", cardColor);
      }

      if (textColor) {
        document.body.style.setProperty("--text-color", textColor);
        localStorage.setItem("textColor", textColor);
        updateTextColorElements(textColor);
      }
    }

    function getAppearanceFromStorageOrCss() {
      const styles = getComputedStyle(document.body);
      return {
        themeColor: localStorage.getItem("themeColor") || rgbToHex(styles.getPropertyValue("--theme-color")),
        cardColor: localStorage.getItem("cardColor") || rgbToHex(styles.getPropertyValue("--card-color")),
        textColor: localStorage.getItem("textColor") || rgbToHex(styles.getPropertyValue("--text-color"))
      };
    }

    function syncAppearanceInputs(inputs, colors) {
      if (inputs.theme) inputs.theme.value = colors.themeColor;
      if (inputs.card) inputs.card.value = colors.cardColor;
      if (inputs.text) inputs.text.value = colors.textColor;
    }

    function buildSettingsPayload(userId) {
      return {
        user_id: userId,
        theme_color: localStorage.getItem("themeColor") || null,
        card_color: localStorage.getItem("cardColor") || null,
        text_color: localStorage.getItem("textColor") || null,
        preferences: {}
      };
    }

    function togglePasswordVisibility(inputId, buttonId) {
      const passwordInput = document.getElementById(inputId);
      const toggleButton = document.getElementById(buttonId);

      if (!passwordInput || !toggleButton) return;

      const isPassword = passwordInput.type === "password";
      passwordInput.type = isPassword ? "text" : "password";
      toggleButton.innerHTML = isPassword
        ? '<i class="fa-solid fa-eye"></i>'
        : '<i class="fa-solid fa-eye-slash"></i>';
    }

    async function getActiveUser() {
      if (currentUser) {
        return currentUser;
      }

      const { data, error } = await client.auth.getSession();
      if (error) {
        throw error;
      }

      currentUser = data?.session?.user || null;
      return currentUser;
    }

    async function fetchSettingsByUserId(userId) {
      let lastError = null;

      for (const tableName of getSettingsTableCandidates()) {
        try {
          const { data, error } = await client
            .from(tableName)
            .select("*")
            .eq("user_id", userId)
            .maybeSingle();

          if (!error) {
            return { data, tableName };
          }

          if (error.code === "PGRST116") {
            return { data: null, tableName };
          }

          if (!isMissingRelationError(error)) {
            return { data: null, tableName, error };
          }

          lastError = error;
        } catch (err) {
          throw err;
        }
      }

      return { data: null, tableName: getSettingsTableCandidates()[0], error: lastError };
    }

    async function upsertSettings(payload) {
      let lastError = null;

      for (const tableName of getSettingsTableCandidates()) {
        try {
          const { error } = await client
            .from(tableName)
            .upsert(payload, { onConflict: "user_id" });

          if (!error) {
            return { success: true, tableName };
          }

          if (!isMissingRelationError(error)) {
            console.error("upsertSettings error", error);
            return { success: false, tableName, error };
          }

          lastError = error;
        } catch (err) {
          throw err;
        }
      }

      if (lastError) {
        console.error("upsertSettings error", lastError);
      }

      return { success: false, tableName: getSettingsTableCandidates()[0], error: lastError };
    }

    function updateUI() {
      const loginScreen = document.getElementById("loginScreen");
      const mainContent = document.getElementById("mainContent");
      const logoutBtn = document.getElementById("logoutBtn");

      if (!loginScreen || !mainContent || !logoutBtn ) {
        console.error("UI要素が見つかりません");
        return;
      }

      loginScreen.style.display = "none";
      mainContent.style.display = "none";
      logoutBtn.style.display = "none";

      if (uiState === "login") {
        loginScreen.style.display = "block";
      }

      if (uiState === "auth") {
        mainContent.style.display = "block";
        logoutBtn.style.display = "block";
      }
    }

    // パスワードの表示/非表示切替
    document.getElementById("loginpasswordview").addEventListener("click", () => {
      togglePasswordVisibility("loginPassword", "loginpasswordview");
    });

    // 表示設定ボタンで表示変更画面に遷移
    document.getElementById("appearanceBtn").addEventListener("click", () => {
      showSection("appearanceSection");
    });

    async function initializeAppearanceSettings() {
      const themeColorInput = document.getElementById("themeColor");
      const cardColorInput = document.getElementById("cardColor");
      const textColorInput = document.getElementById("textColor");
      const saveAppearanceBtn = document.getElementById("saveAppearanceBtn");
      const appearanceMessage = document.getElementById("appearanceMessage");
      const colorInputs = {
        theme: themeColorInput,
        card: cardColorInput,
        text: textColorInput
      };

      function clearAppearanceMessage() {
        if (appearanceMessage) appearanceMessage.textContent = "";
      }

      function applyLocalAppearance() {
        const colors = getAppearanceFromStorageOrCss();
        syncAppearanceInputs(colorInputs, colors);
        applyAppearanceSettings(colors);
      }

      function bindColorInput(input, cssVariable, storageKey, afterApply) {
        if (!input) return;

        input.addEventListener("input", () => {
          const value = input.value;
          if (!isValidHex(value)) return;

          document.body.style.setProperty(cssVariable, value);
          localStorage.setItem(storageKey, value);
          if (afterApply) afterApply(value);
          clearAppearanceMessage();
        });
      }

      // DBから設定を読み込む（ログイン済み前提）
      try {
        const activeUser = await getActiveUser();
        if (!activeUser) {
          applyLocalAppearance();
        } else {
          const userId = activeUser.id;
          const { data, error, tableName } = await fetchSettingsByUserId(userId);

          if (error) {
            console.error(`Settings fetch error (${tableName})`, error);
            if (appearanceMessage) {
              appearanceMessage.textContent = getSupabaseHint(error);
            }
          }

          if (data) {
            const colors = {
              themeColor: rgbToHex((data.theme_color || getComputedStyle(document.body).getPropertyValue("--theme-color")).trim()),
              cardColor: rgbToHex((data.card_color || getComputedStyle(document.body).getPropertyValue("--card-color")).trim()),
              textColor: rgbToHex((data.text_color || getComputedStyle(document.body).getPropertyValue("--text-color")).trim())
            };
            syncAppearanceInputs(colorInputs, colors);
            applyAppearanceSettings(colors);
          } else {
            applyLocalAppearance();
            const toSave = buildSettingsPayload(userId);
            if (toSave.theme_color || toSave.card_color || toSave.text_color) {
              const result = await upsertSettings(toSave);
              if (!result.success) {
                console.error("Initial settings save failed", result.error);
              }
            }
          }
        }
      } catch (err) {
        console.error('Error during settings sync', err);
        if (appearanceMessage) {
          appearanceMessage.textContent = getSupabaseHint(err);
        }
        applyLocalAppearance();
      }

      bindColorInput(themeColorInput, "--theme-color", "themeColor");
      bindColorInput(cardColorInput, "--card-color", "cardColor");
      bindColorInput(textColorInput, "--text-color", "textColor", updateTextColorElements);

      if (saveAppearanceBtn) {
        saveAppearanceBtn.addEventListener("click", async () => {
          if (appearanceMessage) appearanceMessage.textContent = "保存中...";
          const saved = await saveCurrentSettings();
          if (!appearanceMessage) return;
          appearanceMessage.textContent = saved.success
            ? "現在の色をデータベースに保存しました。"
            : getSupabaseHint(saved?.error) || "保存するにはログインが必要です。";
        });
      }

      // 現在のCSS/localStorageをDBに保存（upsert）
      async function saveCurrentSettings() {
        try {
          const activeUser = await getActiveUser();
          if (!activeUser) return { success: false, error: new Error("ログインが必要です。") };

          const toSave = buildSettingsPayload(activeUser.id);
          if (!toSave.theme_color && !toSave.card_color && !toSave.text_color) {
            return { success: false, error: new Error("保存する色がありません。") };
          }
          return await upsertSettings(toSave);
        } catch (err) {
          console.error('saveCurrentSettings error', err);
          return { success: false, error: err };
        }
      }
    }

    // ふりがなをひらがなに固定する
    function normalizeTyping(v) {
      return v.normalize("NFKC");
    }

    const yomiganaInput = document.getElementById("yomigana");

    if (yomiganaInput) {
      yomiganaInput.addEventListener("input", () => {
        yomiganaInput.value = normalizeTyping(yomiganaInput.value);
      });
    }

    function normalizeForSave(v) {
      return v
        .normalize("NFKC")
        .replace(/[\u30a1-\u30f6]/g, c =>
          String.fromCharCode(c.charCodeAt(0) - 0x60)
        );
    }

    // 一覧を読み込む
    async function loadBooks() {
      try {
        const tableName = getBooksTable();

        const { data, error } = await client
          .from(tableName)
          .select("*");

        if (error) {
          console.error("読み込み失敗:", error);
          alert(`書籍データの読み込みに失敗しました。\n${getSupabaseHint(error)}`);
          return;
        }

        if (currentSort === "reading") {
          data.sort((a, b) => {
            const textA = a.yomigana || a.title || "";
            const textB = b.yomigana || b.title || "";
            return textA.localeCompare(textB, 'ja');
          });
        } else if (currentSort === "old") {
          data.sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
        } else {
          data.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
        }

        // リスト生成
        const list = document.getElementById("bookList");
        list.innerHTML = "";

      const menuHtml = currentUser ? `
        <button class="menu-btn">⋮</button>
        <div class="menu">
          <button class="edit-btn">編集</button>
          <button class="delete-btn">削除</button>
        </div>
      ` : "";

        data.forEach(book => {
          const li = document.createElement("li");
          li.className = "card";
          li.dataset.yomigana = book.yomigana || "";

        li.innerHTML = `
          <div class="card-top">
            <div class="title">${book.title}</div>
            <div class="author">${book.author || ""}</div>
          </div>

          <div class="card-bottom">
            <div class="date">${formatDate(book.created_at)}</div>
            ${menuHtml}
          </div>
        `;

        // メニュー開閉(検索方法)
        if (currentUser) {
          const menuBtn = li.querySelector(".menu-btn");
          const menu = li.querySelector(".menu");

          menuBtn.addEventListener("click", (e) => {
          e.stopPropagation();

            // 他のメニューを閉じる
            document.querySelectorAll(".menu.open").forEach(m => {
            m.classList.remove("open");
            const parentCard = m.closest(".card");
            if (parentCard) parentCard.appendChild(m);
            });

            // すでに開いていたら閉じる
            if (menu.classList.contains("open")) {
              menu.classList.remove("open");
              li.appendChild(menu);
              return;
            }

            // メニューをbody直下に移動して表示
            document.body.appendChild(menu);
            const rect = menuBtn.getBoundingClientRect();
            menu.style.position = "fixed";
            menu.style.top = `${rect.bottom + 4}px`;
            menu.style.left = `${rect.right - 80}px`; // 横位置調整
            menu.style.zIndex = 9999;
            menu.classList.add("open");

            // 外側クリックで閉じる
            const closeMenu = (event) => {
              if (!menu.contains(event.target) && event.target !== menuBtn) {
                menu.classList.remove("open");
                li.appendChild(menu);
                document.removeEventListener("click", closeMenu);
              }
            };

          setTimeout(() => document.addEventListener("click", closeMenu), 0);
          })

          // 編集ボタン
          li.querySelector(".edit-btn").onclick = (e) => {
          e.stopPropagation();
            editBook(book);
            menu.classList.remove("open");
            li.appendChild(menu);
          };

          // 削除ボタン
          li.querySelector(".delete-btn").onclick = (e) => {
          e.stopPropagation();  
            deleteBook(book.id);
            menu.classList.remove("open");
            li.appendChild(menu);
          };
        };
          list.appendChild(li);
        });
      } catch (err) {
        console.error("読み込み失敗:", err);
        alert(`書籍データの読み込みに失敗しました。\n${getSupabaseHint(err)}`);
      }
    }

    // 登録 or 更新
    document.getElementById("bookForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const title = document.getElementById("title").value.trim();
      const yomiganaRaw = document.getElementById("yomigana").value;
      const yomigana = normalizeForSave(yomiganaRaw);
      const author = document.getElementById("author").value.trim();
      const editId = document.getElementById("editId").value;

      if (!title) return;

      // 重複チェック
      const tableName = getBooksTable();
      let savedSuccessfully = false;

      const { data: exist, error: existError } = await client
        .from(tableName)
        .select("*")
        .eq("title", title)
        .eq("author", author);
      
      if (existError) {
        alert("確認エラー: " + existError.message);
        return;
      }

      if (!editId && exist.length > 0) {
        alert("その本は既に登録済みです！");
        return;
      }

      let insertData = null;

      if (editId) {
        const { error } = await client
          .from(tableName)
          .update({ title, yomigana, author })
          .eq("id", editId);

        if (error) {
          alert("更新失敗: " + error.message);
          return;
        } else {
          alert("更新しました！");
          savedSuccessfully = true;
        }

      } else {
        insertData = {
          title,
          yomigana,
          author,
          user_id: currentUser.id 
        };

        const { error } = await client
          .from(tableName)
          .insert([insertData]);

        if (error) {
          alert("登録失敗: " + error.message);
          return;
        } else {
          alert("登録しました！");
          savedSuccessfully = true;
        }
      }


      if (savedSuccessfully && title && author) {
        document.querySelector("#result").textContent = "推薦中...";
        const data = await fetchRecommendations(title, author);

        if (data && data.books) {
          const container = document.querySelector("#result");
          container.innerHTML = "";

          const heading = document.createElement("h2");
          heading.textContent = "おすすめの本";
          container.appendChild(heading);

          const table = document.createElement("table");
          table.className = "recommendTable";

          const tbody = document.createElement("tbody");
          Object.entries(data.books).forEach(([keyword, book]) => {
            const tr = document.createElement("tr");
            tr.innerHTML = `
              <td>${keyword}</td>
              <td>${book.title}</td>
              <td>${book.author}</td>
            `;
            tbody.appendChild(tr);
          });
        
          table.appendChild(tbody);
          container.appendChild(table);

        } else {
          document.querySelector("#result").textContent = "関連書籍は見つかりませんでした。";
        }
      }

      // 後始末
      await loadBooks();
      updateUI();
      e.target.reset();
      document.getElementById("editId").value = "";
      document.getElementById("submitBtn").textContent = "登録";
    });

    // 検索機能

    function runSearch() {
      const word = document.getElementById("searchBox").value.toLowerCase().trim();
      const cards = document.querySelectorAll("#bookList .card");
      const noResult = document.getElementById("noResult");

      if (word === "") {
        cards.forEach(card => card.style.display = "");
        noResult.style.display = "none";
        return;
      }

      let hitCount = 0;
      const terms = word.split(/\s+/).filter(Boolean);

      cards.forEach(card => {
        const text =
          card.querySelector(".title").textContent.toLowerCase() + " " +
          card.querySelector(".author").textContent.toLowerCase() + " " +
          (card.dataset.yomigana?.toLowerCase() || "");

        let isMatch;

        if (searchMode === "and") {
          // AND検索（完全一致）
          isMatch = terms.every(t => text.includes(t));
        }else {
          // OR検索（部分一致）
          isMatch = terms.some(t => text.includes(t));
        }
    
        card.style.display = isMatch ? "" : "none";
        if (isMatch) hitCount++;
      });

      noResult.style.display = hitCount === 0 ? "block" : "none";
    }

    document.getElementById("searchBox").addEventListener("keypress", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        e.target.blur();
        runSearch();
      }
    });

    let searchMode = "or";

    const menuBtn = document.querySelector(".search-box-container .search-mode");
    const menuBox = document.querySelector(".search-box-container .menu");
    const btnAND = document.querySelector(".search-box-container .and");
    const btnOR = document.querySelector(".search-box-container .or");

    function updateSearchModeUI() {
      btnAND.classList.toggle("active", searchMode === "and");
      btnOR.classList.toggle("active", searchMode === "or");
    }

    menuBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      menuBox.classList.toggle("open");
    });

    btnAND.addEventListener("click", () => {
      searchMode = "and";
      updateSearchModeUI();
      menuBox.classList.remove("open");
      runSearch();
    });

    btnOR.addEventListener("click", () => {
      searchMode = "or";
      updateSearchModeUI();
      menuBox.classList.remove("open");
      runSearch();
    });

    document.addEventListener("click", (e) => {
      if (!menuBox.contains(e.target) && e.target !== menuBtn) {
        menuBox.classList.remove("open");
      }
    });

    updateSearchModeUI();

    function formatDate(createdAt) {
      const now = new Date();
      const date = new Date(createdAt);
      const diffMs = now - date;
      const diffSec = Math.floor(diffMs / 1000);
      const diffMin = Math.floor(diffSec / 60);
      const diffHour = Math.floor(diffMin / 60);
      const diffDay = Math.floor(diffHour / 24);
      const diffWeek = Math.floor(diffDay / 7);
      const diffMonth = Math.floor(diffDay / 30);
      const diffYear = Math.floor(diffDay / 365);

      if (diffDay === 0) {
        if (diffHour > 0) return `${diffHour}時間前`;
        if (diffMin > 0) return `${diffMin}分前`;
        return "たった今";
      }

      if (diffDay === 1) return "昨日";
      if (diffDay === 2) return "おととい";
      if (diffDay >= 3 && diffDay <= 7) return `${diffDay}日前`;
      if (diffWeek <= 4) return `${diffWeek}週間前`;
      if (diffMonth <= 11) return `${diffMonth}ヶ月前`;
      return `${diffYear}年前`;
    }

    // 編集
    function editBook(book) {
      document.getElementById("title").value = book.title;
      document.getElementById("yomigana").value = book.yomigana;
      document.getElementById("author").value = book.author;
      document.getElementById("editId").value = book.id;
      document.getElementById("submitBtn").textContent = "更新";
    }

    // 削除
    async function deleteBook(id) {
      if (!confirm("本当に削除しますか？")) return;
      const tableName = getBooksTable();
      const { error } = await client.from(tableName).delete().eq("id", id);
      if (error) alert("削除失敗: " + error.message);
      else alert("削除しました！");
      loadBooks();
    }

    document.getElementById("selectOrder").addEventListener("change", (e) => {
      currentSort = e.target.value;
      loadBooks();
    });

    async function handleLogin() {
      const email = document.getElementById("loginEmail").value.trim();
      const password = document.getElementById("loginPassword").value;
      const message = document.getElementById("loginMessage");
      if (!email || !password){message.textContent = "メールアドレスとパシワードを入力してください。";return;};

      const { data, error } = await client.auth.signInWithPassword({
        email,
        password
      });

      if (error) {
        message.textContent = "ログインできませんでした。パスワードを忘れた場合は再登録してください。：" + error.message;
      } else {
        message.textContent = "ログイン成功！";
        uiState = "auth";
        currentUser = data.user;
        updateUI();
        loadBooks();
      }
    }

    // ログイン
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      await handleLogin();
    });

    document.getElementById("loginBtn").addEventListener("click", async () => {
      await handleLogin();
    });

    // 新規登録
    document.getElementById("signupBtn").addEventListener("click", async () => {
      const email = document.getElementById("loginEmail").value;
      const password = document.getElementById("loginPassword").value;
      const message = document.getElementById("loginMessage");

      const { data, error } = await client.auth.signUp({
        email,
        password
      });

      if (error) {
        message.textContent = "登録失敗：" + error.message;
      } else {
        message.textContent = "登録成功！確認メールを送信しました。";
      }
    });

    // ホームメニュー
    const homeMenuBtn = document.getElementById("homeMenuBtn");
    const homeMenu = document.getElementById("homeMenu");

    //　メニュー開閉（ホームメニュー）
    homeMenuBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      homeMenu.style.display = homeMenu.style.display === "none" ? "block" : "none";
    });

    // ホームメニュー外クリックで閉じる
    document.addEventListener("click", (e) => {
      if (!homeMenu.contains(e.target) && e.target !== homeMenuBtn) {
        homeMenu.style.display = "none";
      }
    });

    // ログアウト
    const logoutBtn = document.getElementById("logoutBtn");

    logoutBtn.addEventListener("click", async () => {
      const { error } = await client.auth.signOut();

      if (error) {
        console.error("ログアウト失敗", error);
        alert("ログアウトに失敗しました");
        return;
      }

      currentUser = null;
      uiState = "login";
      updateUI();
    });

    // 画面切り替え用関数
    function showSection(sectionId) {
      SECTION_IDS.forEach(id => {
        document.getElementById(id).style.display = "none";
      });

      document.getElementById(sectionId).style.display = "block";
    }

    // パスワード変更ボタンで遷移
    document.getElementById("changePasswordBtn").addEventListener("click", () => {
      showSection("changePasswordSection");
    });

    // パスワード変更
    document.getElementById("changePasswordForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const oldPassword = document.getElementById("oldPassword").value;
      const newPassword = document.getElementById("newPassword").value;
      const message = document.getElementById("changePasswordMessage");

      if (!currentUser) {
        message.textContent = "ログインしてください。";
        return;
      }

      if (newPassword.length < 8) {
        message.textContent = "新しいパスワードは8文字以上にしてください。";
        return;
      }

      // 再認証
      const { error: reauthError } = await client.auth.signInWithPassword({
        email: currentUser.email,
        password: oldPassword
      });

      if (reauthError) {
        message.textContent = "現在のパスワードが正しくありません。";
        return;
      }

      // パスワード更新
      const { error: updateError } = await client.auth.updateUser({
        password: newPassword
      });

      if (updateError) {
        message.textContent = "変更に失敗しました：" + updateError.message;
        return;
      }

      message.textContent = "パスワードを変更しました。";
      e.target.reset();
    });

    // 新パスワードの表示/非表示切替
    document.getElementById("newpasswordview").addEventListener("click", () => {
      togglePasswordVisibility("newPassword", "newpasswordview");
    });

    // 旧パスワードの表示/非表示切替
    document.getElementById("oldpasswordview").addEventListener("click", () => {
      togglePasswordVisibility("oldPassword", "oldpasswordview");
    });

    // 戻るボタンで遷移
    Array.from(document.getElementsByClassName("return-btn")).forEach(btn => {
      btn.addEventListener("click", (e) => {
        e.preventDefault(); // フォーム送信やページ遷移を防ぐ
        showSection("mainContent");
      });
    });

    async function initializeApp() {
      const { data } = await client.auth.getSession();

      if (data.session) {
        currentUser = data.session.user;
        uiState = "auth";
      } else {
        currentUser = null;
        uiState = "login";
      }

      updateUI();
      await initializeAppearanceSettings();
      if (uiState === "auth") {
        await loadBooks();
      }
    }

    document.addEventListener("DOMContentLoaded", initializeApp);

    // 推薦API呼び出し
    async function fetchRecommendations(title, author) {
      try {
        const response = await fetch("https://backend-5x35.onrender.com/api/books", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ title, author })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "APIエラー");
        }

        console.log("推薦結果:", data);
        return data;
      } catch (error) {
        console.error("通信エラー:", error);
        return null;
      }
    }
  </script>
